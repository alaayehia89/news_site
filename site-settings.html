<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إعدادات الموقع</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="sidebar-brand" data-site-logo>A</div>
        <nav class="sidebar-nav">
          <a class="nav-item" href="dashboard.html">نظرة عامة</a>
          <a class="nav-item" href="dashboard.html#article-management">الأخبار والمقالات</a>
          <a class="nav-item active" href="site-settings.html">إعدادات الموقع</a>
        </nav>
        <button class="logout-btn" id="logoutBtn">تسجيل الخروج</button>
      </aside>

      <main class="dashboard-main">
        <header class="topbar">
          <div>
            <p class="topbar-label">الإعدادات</p>
            <h1>إعدادات الموقع</h1>
          </div>
          <a href="news-home.html" class="primary-btn small-btn">عرض الموقع</a>
        </header>

        <section class="panel identity-settings-page">
          <div class="panel-header">
            <h3>الهوية البصرية والنصوص العامة</h3>
          </div>
          <form id="identityForm" class="identity-form">
            <div class="identity-fields">
              <label>
                اسم الموقع
                <input id="siteNameInput" type="text" placeholder="اسم الموقع" required />
              </label>
              <label>
                وصف الموقع
                <input id="taglineInput" type="text" placeholder="وصف مختصر يظهر في الواجهة" />
              </label>
              <label>
                رابط الشعار
                <input id="logoUrlInput" type="url" placeholder="https://example.com/logo.png" />
              </label>
              <label>
                رابط أيقونة المتصفح
                <input id="faviconUrlInput" type="url" placeholder="https://example.com/favicon.png" />
              </label>
              <label>
                اللون الأساسي
                <input id="primaryColorInput" type="color" value="#1d4ed8" />
              </label>
              <label>
                لون التمييز
                <input id="accentColorInput" type="color" value="#dc2626" />
              </label>
              <label>
                لون خلفية الموقع
                <input id="backgroundColorInput" type="color" value="#f4f7fb" />
              </label>
              <label>
                لون النص
                <input id="textColorInput" type="color" value="#0f172a" />
              </label>
              <label>
                عنوان شارة الصفحة الرئيسية
                <input id="heroBadgeInput" type="text" placeholder="أحدث الأخبار" />
              </label>
              <label>
                العنوان الرئيسي
                <input id="heroTitleInput" type="text" placeholder="العنوان الرئيسي" required />
              </label>
              <label class="identity-field-wide">
                وصف الصفحة الرئيسية
                <textarea id="heroDescriptionInput" rows="3" placeholder="وصف الموقع"></textarea>
              </label>
              <label>
                زر الصفحة الرئيسي
                <input id="heroPrimaryActionInput" type="text" placeholder="اقرأ الأخبار" />
              </label>
              <label>
                زر الصفحة الثانوي
                <input id="heroSecondaryActionInput" type="text" placeholder="لوحة التحرير" />
              </label>
            </div>

            <div class="identity-preview">
              <div class="identity-preview-logo" id="identityPreviewLogo">A</div>
              <div>
                <strong id="identityPreviewName">الخبر</strong>
                <p id="identityPreviewTagline">تغطية مستمرة للأحداث</p>
              </div>
            </div>

            <button type="submit" class="primary-btn">حفظ الهوية البصرية</button>
            <p id="identityStatus" class="form-status" aria-live="polite"></p>
          </form>
        </section>

        <section class="panel site-visibility-panel">
          <div class="panel-header">
            <h3>الأجزاء الظاهرة في الصفحة الرئيسية</h3>
          </div>
          <div class="visibility-controls">
            <label><input id="showBreakingInput" type="checkbox" /> إظهار شريط العواجل</label>
            <label><input id="showLatestAnalysisInput" type="checkbox" /> إظهار أحدث تحليل</label>
            <label><input id="showFiltersInput" type="checkbox" /> إظهار فلاتر الأخبار</label>
          </div>
          <button id="saveVisibilityBtn" type="button" class="primary-btn">حفظ عرض الصفحة</button>
          <button id="resetSettingsBtn" type="button" class="danger-outline-btn">استعادة الإعدادات الافتراضية</button>
          <p id="visibilityStatus" class="form-status" aria-live="polite"></p>
        </section>

        <section class="panel section-labels-panel">
          <div class="panel-header">
            <h3>تعديل مسميات الأقسام</h3>
          </div>
          <form id="sectionLabelsForm" class="identity-form">
            <div class="identity-fields section-label-fields">
              <label>العواجل<input data-section-label-key="breaking" type="text" required /></label>
              <label>السياسة<input data-section-label-key="politics" type="text" required /></label>
              <label>الاقتصاد<input data-section-label-key="economy" type="text" required /></label>
              <label>الرياضة<input data-section-label-key="sports" type="text" required /></label>
              <label>التقنية<input data-section-label-key="technology" type="text" required /></label>
              <label>الثقافة<input data-section-label-key="culture" type="text" required /></label>
              <label>الرأي<input data-section-label-key="opinion" type="text" required /></label>
              <label>التحليلات<input data-section-label-key="analysis" type="text" required /></label>
            </div>
            <button type="submit" class="primary-btn">حفظ مسميات الأقسام</button>
            <p id="sectionLabelsStatus" class="form-status" aria-live="polite"></p>
          </form>
        </section>
      </main>
    </div>

    <script src="site-config.js"></script>
    <script src="site-settings.js"></script>
  </body>
</html>
